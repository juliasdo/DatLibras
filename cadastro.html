<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Cadastro | DatLibras</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS do DatLibras -->
    <link href="css/principal.css" rel="stylesheet">
</head>

<body class="auth-page">

    <!-- Barra de navegação -->
    <nav class="navbar">
        <div class="container">

            <a class="brand" href="index.html">
                🤟 Dat<span>Libras</span>
            </a>

            <a href="index.html" class="nav-link">
                ← Voltar ao início
            </a>

        </div>
    </nav>

    <!-- Conteúdo principal -->
    <main class="container auth-wrap">

        <!-- Apresentação -->
        <div class="auth-visual">

            <div class="auth-emoji">💜</div>

            <h2>Sua jornada começa aqui!</h2>

            <p>
                Crie sua conta e acompanhe sua evolução
                no aprendizado de Libras.
            </p>

        </div>

        <!-- Tela de cadastro -->
        <section class="auth-card">

            <span class="eyebrow">FAÇA PARTE</span>

            <h1>Criar conta</h1>

            <p class="muted">
                Preencha seus dados para começar.
            </p>

            <!-- Formulário de cadastro -->
            <form id="cadastroForm">

                <label for="nome">Nome completo</label>

                <input
                    class="form-control"
                    id="nome"
                    type="text"
                    autocomplete="name"
                    required
                    placeholder="Seu nome"
                >

                <label for="cadEmail">E-mail</label>

                <input
                    class="form-control"
                    id="cadEmail"
                    type="email"
                    autocomplete="email"
                    required
                    placeholder="seuemail@exemplo.com"
                >

                <label for="cadSenha">Senha</label>

                <input
                    class="form-control"
                    id="cadSenha"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                    placeholder="Mínimo de 8 caracteres"
                >

                <label for="confirmarSenha">
                    Confirmar senha
                </label>

                <input
                    class="form-control"
                    id="confirmarSenha"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                    placeholder="Repita sua senha"
                >

                <!-- Termos de uso -->
                <label class="check my-3">

                    <input
                        type="checkbox"
                        id="termos"
                        required
                    >

                    Li e aceito os termos de uso.

                </label>

                <!-- Botão de cadastro -->
                <button type="submit" class="btn btn-purple w-100">
                    Criar minha conta
                </button>

            </form>

            <p class="auth-bottom">
                Já tem conta?
                <a href="login.html">Entrar</a>
            </p>

            <p class="demo-note">
                Seu nome será exibido no ranking
                para outros usuários cadastrados.
            </p>

        </section>

    </main>

    <!-- Biblioteca Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Conexão com o banco de dados -->
    <script src="js/supabase.js"></script>

    <!-- Autenticação dos usuários -->
    <script src="js/auth.js"></script>

</body>

</html>

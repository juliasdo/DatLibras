
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Meu perfil | DatLibras</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS do DatLibras -->
    <link href="css/principal.css" rel="stylesheet">
</head>

<body>

    <!-- Barra de navegação -->
    <nav class="navbar">
        <div class="container">

            <a class="brand" href="inicio.html">
                🤟 Dat<span>Libras</span>
            </a>

            <a href="inicio.html" class="nav-link">
                ← Minha área
            </a>

        </div>
    </nav>

    <!-- Conteúdo principal -->
    <main class="container app-main narrow">

        <div class="page-heading">

            <span class="eyebrow">SUA CONTA</span>

            <h1>Meu perfil</h1>

            <p>
                Confira seus dados e acompanhe
                sua evolução no DatLibras.
            </p>

        </div>

        <!-- Informações do usuário -->
        <section class="panel profile-card">

            <div class="profile-avatar">👤</div>

            <h2 id="perfilNome">Carregando...</h2>

            <p id="perfilEmail" class="muted"></p>

            <!-- Estatísticas -->
            <div class="profile-stats">

                <div>

                    <strong id="perfilPontos">--</strong>

                    <span>Pontos conquistados</span>

                </div>

                <div>

                    <strong id="perfilLetras">--</strong>

                    <span>Letras concluídas</span>

                </div>

                <div>

                    <strong>26</strong>

                    <span>Letras para explorar</span>

                </div>

            </div>

            <p id="perfilMensagem" role="status"></p>

            <!-- Encerrar sessão -->
            <button
                type="button"
                id="sair"
                class="btn btn-outline-purple mt-4"
            >
                Sair da minha conta
            </button>

            <p class="small muted mt-3">
                Seu progresso é salvo na sua conta DatLibras.
            </p>

        </section>

    </main>

    <!-- Biblioteca Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Conexão com o banco de dados -->
    <script src="js/supabase.js"></script>

    <!-- Autenticação -->
    <script src="js/auth.js"></script>

    <!-- Carregamento do progresso -->
    <script>

        async function carregarPerfil() {

            const mensagem =
                document.getElementById("perfilMensagem");

            try {

                const { data: sessao, error: erroSessao } =
                    await supabaseClient.auth.getSession();

                if (erroSessao) {
                    mensagem.textContent =
                        "Erro ao verificar a sessão.";
                    return;
                }

                if (!sessao.session) {

                    location.replace("login.html");

                    return;

                }

                const { data: autenticacao, error: erroAuth } =
                    await supabaseClient.auth.getUser();

                if (erroAuth || !autenticacao.user) {

                    mensagem.textContent =
                        "Não foi possível carregar a conta.";

                    return;

                }

                const usuario = autenticacao.user;

                const { data, error } = await supabaseClient
                    .from("progresso")
                    .select("letra, pontos")
                    .eq("usuario_id", usuario.id);

                if (error) {

                    mensagem.textContent =
                        "Não foi possível carregar o progresso.";

                    console.error(error);

                    return;

                }

                const pontos = data.reduce(
                    (total, registro) => total + registro.pontos,
                    0
                );

                document.getElementById("perfilPontos").textContent =
                    pontos;

                document.getElementById("perfilLetras").textContent =
                    data.length + " de 4";

            } catch (error) {

                mensagem.textContent = "Erro de conexão.";

                console.error(error);

            }

        }

        carregarPerfil();

    </script>

</body>

</html>
